# instance-manifest.example.conf — DANE instancji Szem (fikcyjne demo).
# Kopiujesz na swoj prywatny manifest (POZA publiczna formatka) i wypelniasz realnymi sektorami/rolami.
# Uzycie: sudo bash bootstrap-instancji.sh instance-manifest.conf

GITOLITE_USER=szem-git                 # dedykowany user OS (gitolite przejmuje jego authorized_keys)
INSTANCE_HOST=localhost                # localhost-first; LAN = osobna decyzja + threat-review
AGENT_KEYS_DIR=/srv/szem/agent-keys    # klucze rol (ext4). MUSI byc czytelny dla usera agenta - NIE /root (700 => nie-root nie odczyta)
AGENT_OS_USER=                         # OS-user uruchamiajacy agentow (nie-root): bootstrap chown mu klucze. Puste = agent jako root (WSL-default). fix #2
FORMATKA_URL=file:///srv/szem/szem.git # = SCIEZKA DO TWOJEGO klonu/huba szem.git (ustaw na swoj); submodule-pin=kotwica integralnosci
META_REPO=demo-instance
SOFT_REPO=demo-soft

# Kto czyta meta (pin+wskazania) i soft (foldery SOFT). Agent-role = R only na meta (pin chroniony).
META_READERS="rola-alpha rola-beta"
SOFT_READERS="rola-alpha rola-beta"

# Sektory: "nazwa|granica(HARD|SOFT)|RW-role(spacja)|R-role(spacja)"
#  HARD = osobne key-gated repo; SOFT = folder w SOFT_REPO (niska wrazliwosc).
#  Sama nazwa sektora NIE moze niesc tresci wrazliwej (kontrakt).
SECTORS=(
  "sektor-alpha|HARD|rola-alpha|rola-beta"
  "sektor-beta|HARD|rola-beta|"
  "sektor-notatki|SOFT|rola-alpha|rola-beta"
)

# Role instancji (para kluczy ed25519 per rola; prywatny zostaje przy agencie).
ROLES=(rola-alpha rola-beta)

# --- workspace-builder.sh (adapter-omp, strona agenta) ---
# INSTANCE_DIR  = katalog gdzie zyje instancja (meta+submodule formatka); default ./instancja
# Watcher jest pełny; role mają odrębne cursory, ale żadnych filtrów domen.
INSTANCE_DIR=./instancja
