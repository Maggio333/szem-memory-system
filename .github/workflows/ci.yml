name: ci
# Materializuje finding cold-review #5: shellcheck + smoke narzędzi (dotąd verify był tylko w runtime).
# "Formatka self-correcting" = własne narzędzia też pod bramką, nie tylko treść.
on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (błędy)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error tools/*.sh

      - name: bash -n (składnia)
        run: for f in tools/*.sh; do bash -n "$f"; done

      - name: parser bezpieczny — RCE-CLOSED (#1)
        shell: bash
        run: |
          . tools/lib-manifest.sh
          printf 'GITOLITE_USER=x\nFORMATKA_URL=y\nROLES=(a b)\nSECTORS=(\n  "s|HARD|a|"\n)\nPWNED=$(touch /tmp/PWNED)\n' > /tmp/ok.conf
          rm -f /tmp/PWNED
          load_manifest /tmp/ok.conf
          test ! -e /tmp/PWNED                       # kod z manifestu NIE wykonany
          test "${#SECTORS[@]}" = 1                  # SECTORS sparsowane
          test "${ROLES[*]}" = "a b"                 # ROLES sparsowane

      - name: parser odrzuca śmieciowe nazwy (nit re-gate)
        shell: bash
        run: |
          . tools/lib-manifest.sh
          printf 'FORMATKA_URL=y\nROLES=(good bad;name)\n' > /tmp/bad.conf
          if load_manifest /tmp/bad.conf 2>/dev/null; then echo "FAIL: powinno odrzucic smieciowa nazwe"; exit 1; fi
          echo "OK: smieciowa nazwa odrzucona"

      - name: workspace builder — profil, Beads i bezpieczny slug
        run: bash tools/test-workspace-builder.sh

      - name: walidator węzłów — selftest
        run: python3 tools/validate-wezly.py --selftest

      - name: scrub-gate — historia zakresu pusha
        shell: bash
        run: |
          set -eu
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          script="$GITHUB_WORKSPACE/tools/scrub-gate.sh"
          git -C "$d" init -q
          git -C "$d" config user.email ci@example.invalid
          git -C "$d" config user.name ci
          printf 'clean\n' > "$d/file.txt"
          git -C "$d" add file.txt
          git -C "$d" commit -qm base
          base="$(git -C "$d" rev-parse HEAD)"
          printf 'PWNED_MARKER\n' > "$d/file.txt"
          git -C "$d" commit -qam secret
          secret="$(git -C "$d" rev-parse HEAD)"
          printf 'clean again\n' > "$d/file.txt"
          git -C "$d" commit -qam remove
          clean="$(git -C "$d" rev-parse HEAD)"
          printf 'PWNED_MARKER\n' > "$d/registry"
          if printf 'refs/heads/main %s refs/heads/main %s\n' "$clean" "$base" |
              (cd "$d" && bash "$script" "$d/registry" >/dev/null 2>&1); then
            echo "FAIL: A(secret)->B(remove) powinno byc odrzucone"
            exit 1
          fi
          printf 'refs/heads/main %s refs/heads/main %s\n' "$clean" "$secret" |
            (cd "$d" && bash "$script" "$d/registry" >/dev/null)
          if printf 'refs/heads/new %s refs/heads/new %s\n' "$secret" \
              0000000000000000000000000000000000000000 |
              (cd "$d" && bash "$script" "$d/registry" >/dev/null 2>&1); then
            echo "FAIL: branch-create z sekretnym blobem powinien byc odrzucony"
            exit 1
          fi
          git -C "$d" checkout -qb other "$base"
          printf 'other\n' > "$d/file.txt"
          git -C "$d" commit -qam other
          other="$(git -C "$d" rev-parse HEAD)"
          if printf 'refs/a %s refs/a %s\nrefs/b %s refs/b %s\n' "$clean" "$base" "$secret" "$base" |
              (cd "$d" && bash "$script" "$d/registry" >/dev/null 2>&1); then
            echo "FAIL: multi-ref z historycznym sekretem powinien byc odrzucony"
            exit 1
          fi
          if printf 'refs/heads/other %s refs/heads/remote %s\n' "$secret" "$other" |
              (cd "$d" && bash "$script" "$d/registry" >/dev/null 2>&1); then
            echo "FAIL: force-push non-ancestor z sekretem powinien byc odrzucony"
            exit 1
          fi
          if (cd "$d" && bash "$script" "$d/missing" </dev/null >/dev/null 2>&1); then
            echo "FAIL: brak rejestru powinien byc fail-closed"
            exit 1
          fi
          : > "$d/empty-registry"
          if (cd "$d" && bash "$script" "$d/empty-registry" </dev/null >/dev/null 2>&1); then
            echo "FAIL: pusty rejestr powinien byc fail-closed"
            exit 1
          fi

      - name: forum duty — durable checkin and wake handoff
        run: bash tools/test-forum-duty.sh
